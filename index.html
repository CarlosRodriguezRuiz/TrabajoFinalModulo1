<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <!-- Leaflet JS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <title>TerremotosInfo.com</title>

    <link rel="stylesheet" href="style/normalice.css" />
    <link rel="stylesheet" href="style/style.css" />

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

    <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="script.js"></script>
    <script defer src="grafica.js"></script>
  </head>

  <body>
    <header>
      <h1>TerremotosInfo.com</h1>
    </header>
    <section id="login">
      <h2>Iniciar sesión</h2>
      <form id="formLogin">
        <input type="email" name="email" placeholder="Correo" required />
        <input
          type="password"
          name="password"
          placeholder="Contraseña"
          required
        />
        <button type="submit">Iniciar sesión</button>
      </form>

      <p id="message">No hay usuarios en el sistema</p>

      <button id="salir">Cerrar sesión</button>
    </section>
    <section>
      <aside>
        <nav>
          <button id="boton1">1ª parte del ejercicio</button>

          <button id="boton2">2ª parte del ejercicio</button>

          <!-- CONTINENTES OCULTOS INICIALMENTE -->
          <div id="contenedorContinentes" hidden>
            <div id="euDiv">
              <button id="euButton">Europa</button>
            </div>

            <div id="asDiv">
              <button id="asButton">Asia</button>
            </div>

            <div id="amDiv">
              <button id="amButton">América</button>
            </div>

            <div id="ocDiv">
              <button id="ocButton">Oceanía</button>
            </div>

            <div id="afDiv">
              <button id="afButton">África</button>
            </div>
          </div>
        </nav>
      </aside>
      <img id="cargando" src="" alt="" />
      <div id="map"></div>
    </section>
    <article><canvas id="miGrafica"></canvas></article>
  </body>
</html>
